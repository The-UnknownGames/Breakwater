# Publishes the playable build to GitHub Pages (gh-pages branch) on every
# push to the working branches. One-time setup: Settings -> Pages ->
# Source: "Deploy from a branch", branch gh-pages, folder / (root).
name: Pages

on:
  push:
    branches:
      - main
      - claude/breakwater-rescue-creep-fix-rh4b98
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node scripts/artifact.mjs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Pages: ${{ github.sha }}'
